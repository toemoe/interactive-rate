<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" type="text/css" href="styles.css">
  <script defer src="script.js"></script>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <article class="main" id="main">
    <div class="pic_background">
      <img src="images/icon-star.svg" alt="star" class="picture_star" />
    </div>
    <h1 class="h1">How did we do?</h1>

    <p class="description">Please let us know how we did with your support request. All feedback is appreciated 
      to help us improve our offering!</p>
      <ul class="rate">
        <li><button class="rate_button">1</button></li>
        <li><button class="rate_button">2</button></li>
        <li><button class="rate_button">3</button></li>
        <li><button class="rate_button">4</button></li>
        <li><button class="rate_button">5</button></li>
      </ul>
  
    <button class="main_button" onclick="showWindow('result')">Submit</button>
  </article>
  
  <article class="result" style="display:none;" id="result">
  You selected out of 5

  Thank you!

  We appreciate you taking the time to give a rating. If you ever need more support, 
  don't hesitate to get in touch!
  </article>
</body>
</html>
